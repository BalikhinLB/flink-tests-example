plugins {
    id 'java'
    id 'jacoco'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.3'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.lb.job.simple.Main'
    }
}

configurations {
    koraBom
    annotationProcessor.extendsFrom(koraBom)
    compileOnly.extendsFrom(koraBom)
    implementation.extendsFrom(koraBom)
    api.extendsFrom(koraBom)
}

dependencies {
    koraBom platform("ru.tinkoff.kora:kora-parent:1.2.4")
    annotationProcessor "ru.tinkoff.kora:annotation-processors"
    implementation "ru.tinkoff.kora:common"
    implementation "ru.tinkoff.kora:config-hocon"

    //логи для local разработки
    compileOnly "org.slf4j:slf4j-api:2.0.9"
    runtimeOnly "ch.qos.logback:logback-classic:1.4.14"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    //local development (можно изменить на compileOnly для уменьшения jar файла)
    implementation "org.apache.flink:flink-walkthrough-common:${flinkVersion}"
    implementation "org.apache.flink:flink-streaming-java:${flinkVersion}"
    implementation "org.apache.flink:flink-clients:${flinkVersion}"
    implementation "org.apache.flink:flink-runtime-web:${flinkVersion}"

    //connectors
    implementation "org.apache.flink:flink-connector-base:${flinkVersion}"
    implementation "org.apache.flink:flink-connector-kafka:3.3.0-1.19"
    //json format
    implementation "org.apache.flink:flink-json:${flinkVersion}"

    //testing
    testImplementation "ru.tinkoff.kora:test-junit5"
    testImplementation "org.apache.flink:flink-test-utils:${flinkVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testImplementation "org.testcontainers:kafka:1.21.3"
    testImplementation "org.testcontainers:testcontainers:1.21.3"
    testImplementation 'commons-codec:commons-codec:1.17.1'
    testImplementation "org.junit-pioneer:junit-pioneer:2.3.0"
    testImplementation 'org.mock-server:mockserver-junit-jupiter:5.15.0'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation "org.skyscreamer:jsonassert:1.5.1"
    testImplementation "com.github.stefanbirkner:system-lambda:1.2.1"

    //local logging
    runtimeOnly "org.apache.logging.log4j:log4j-slf4j-impl:${log4jVersion}"
    runtimeOnly "org.apache.logging.log4j:log4j-core:${log4jVersion}"
}

tasks.withType(JavaExec).configureEach {
    jvmArgs += [
            "--add-opens=java.base/java.util=ALL-UNNAMED"
    ]
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of("17"))
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    jvmArgs "--add-opens", "java.base/java.lang=ALL-UNNAMED"
    jvmArgs "--add-opens", "java.base/java.util=ALL-UNNAMED"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/jacocoTest.xml')
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/html')
    }
}

shadowJar {
    exclude "org/slf4j/**"
    exclude "ch/qos/logback/**"
    exclude "org/apache/logging/log4j/**"
}